services:
  db:
    image: postgres:16
    container_name: drone-sim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone_pass
      POSTGRES_DB: drone_sim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
